    </linearGradient>
    <linearGradient id="darkChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  
            <g filter="url(#dropShadow)" transform="translate(95, 25)">
