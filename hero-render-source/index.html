<!doctype html>
<meta charset="utf-8">
<title>render</title>
<body style="margin:0;background:#000">
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias: false, preserveDrawingBuffer: true, alpha: false});
if (!gl) throw new Error('no webgl2');
gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');

const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.-1.,0.,1.); }`;

// ------------------------------------------------------------------ scene shader
const FS_SCENE = `#version 300 es
precision highp float; precision highp sampler2D;
uniform vec2 uRes; uniform vec3 uCam, uRight, uUp, uFwd; uniform float uTanHalf;
uniform float uPhase;
uniform vec3 uL1, uL2, uC1, uC2;
uniform float uAmb, uEnv, uPulseGain, uPulseSpacing, uPulseCycles;
uniform vec2 uBoard; uniform vec2 uTexSize; uniform float uPxmm; uniform float uHmax;
uniform sampler2D uAlb, uNrm, uHgt, uTr;
out vec4 oCol;
const float PI = 3.14159265;
const float TABLE = -1.6;

float hAt(vec2 xz, float lod){
  vec2 uv = xz / uBoard;
  if (uv.x < 0. || uv.y < 0. || uv.x > 1. || uv.y > 1.) return TABLE;
  return textureLod(uHgt, uv, lod).r;
}
float softShadow(vec3 p, vec3 L){
  float res = 1.0; float t = 0.04;
  for (int i = 0; i < 30; i++){
    vec3 q = p + L * t;
    if (q.y > uHmax) break;
    float d = q.y - hAt(q.xz, 1.0 + float(i) * 0.12);
    res = min(res, 7.0 * d / t);
    if (res < 0.0) break;
    t += 0.05 + 0.17 * t;
  }
  return clamp(res, 0.0, 1.0);
}
float D_GGX(float nh, float a){ float a2 = a*a; float d = nh*nh*(a2-1.)+1.; return a2/(PI*d*d + 1e-5); }
float G_S(float nv, float nl, float a){ float k = a*0.5; return (nv/(nv*(1.-k)+k)) * (nl/(nl*(1.-k)+k)); }
vec3 F_S(vec3 F0, float c){ return F0 + (vec3(1.) - F0) * pow(1.0 - c, 5.0); }

vec3 envMap(vec3 R, float rough){
  float y = R.y;
  vec3 base = mix(vec3(0.012,0.024,0.026), vec3(0.070,0.150,0.160), smoothstep(-0.2, 0.9, y));
  float soft = 0.03 + rough * 0.55;
  float cA = dot(R, uL1);
  float boxA = smoothstep(0.93 - soft, 0.93 + soft*0.25, cA);
  float cB = dot(R, uL2);
  float boxB = smoothstep(0.90 - soft, 0.90 + soft*0.25, cB);
  float sx = R.x - 0.35 * sin(uPhase * 6.28318530);
  float strip = (1.0 - smoothstep(0.10, 0.10 + 0.10 + soft, abs(sx))) * smoothstep(0.25, 0.55, y);
  return base + uC1 * boxA * 1.6 + uC2 * boxB * 1.3 + vec3(1.0, 0.86, 0.66) * strip * 1.8;
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 p = (frag - 0.5 * uRes) / uRes.y;
  vec3 rd = normalize(uFwd + (p.x * uRight + p.y * uUp) * 2.0 * uTanHalf);
  vec3 ro = uCam;
  float pixAng = 2.0 * uTanHalf / uRes.y;

  vec3 bg = vec3(0.004, 0.010, 0.011);
  vec3 col = bg; float tHit = 120.0;

  if (rd.y < -1e-4) {
    float t0 = max((uHmax - ro.y) / rd.y, 0.0);
    float t1 = (TABLE - ro.y) / rd.y;
    const int N = 120;
    float dt = (t1 - t0) / float(N);
    float t = t0, tPrev = t0; bool hit = false;
    float lodBase = log2(max(t0 * pixAng * uPxmm, 1.0));
    float lodH = clamp(lodBase - 0.3, 0.0, 5.0);
    for (int i = 0; i < N; i++){
      vec3 q = ro + rd * t;
      if (q.y < hAt(q.xz, lodH)) { hit = true; break; }
      tPrev = t; t += dt;
    }
    if (hit) {
      float a = tPrev, b = t;
      for (int j = 0; j < 9; j++){
        float tm = 0.5 * (a + b);
        vec3 q = ro + rd * tm;
        if (q.y < hAt(q.xz, lodH * 0.5)) b = tm; else a = tm;
      }
      t = b; tHit = t;
      vec3 P = ro + rd * t;
      vec3 V = -rd;
      vec2 uv = P.xz / uBoard;
      bool inside = uv.x > 0.0005 && uv.y > 0.0005 && uv.x < 0.9995 && uv.y < 0.9995;
      float lodT = max(log2(max(t * pixAng * uPxmm, 1.0)), 0.0);
      vec3 alb; float met, rough, ao; vec3 N;
      if (inside && P.y > -0.2) {
        vec4 A = textureLod(uAlb, uv, lodT);
        vec4 Nm = textureLod(uNrm, uv, lodT);
        alb = A.rgb; met = A.a; rough = Nm.a; ao = Nm.b;
        N = vec3(Nm.r * 2. - 1., 0., Nm.g * 2. - 1.);
        N.y = sqrt(max(1.0 - dot(N.xz, N.xz), 0.0004));
        N = normalize(N);
      } else {
        alb = vec3(0.004, 0.010, 0.009); met = 0.0; rough = 0.7; ao = 0.6;
        vec2 e = vec2(min(P.x, uBoard.x - P.x), min(P.z, uBoard.y - P.z));
        if (P.y > -1.55 && inside == false) {
          N = vec3(0.,1.,0.);
        } else {
          N = vec3(0.,1.,0.);
        }
        alb = vec3(0.006, 0.030, 0.022);
      }
      rough = clamp(rough, 0.06, 1.0);
      float a2r = rough * rough;
      vec3 F0 = mix(vec3(0.04), alb, met);
      vec3 diffc = (1.0 - met) * alb / PI;
      float nv = max(dot(N, V), 1e-3);

      // key light (soft shadowed)
      float nl = max(dot(N, uL1), 0.0);
      float sh = nl > 0.0 ? softShadow(P + N * 0.02, uL1) : 0.0;
      vec3 Hh = normalize(uL1 + V);
      float nh = max(dot(N, Hh), 0.0), vh = max(dot(V, Hh), 0.0);
      vec3 F = F_S(F0, vh);
      vec3 spec = D_GGX(nh, a2r) * G_S(nv, nl, a2r) * F / (4.0 * nv * max(nl, 1e-3) + 1e-4);
      col = ((1.0 - F) * diffc + spec) * uC1 * nl * sh * 3.2;
      // cool rim/fill
      float nl2 = max(dot(N, uL2), 0.0);
      vec3 H2 = normalize(uL2 + V);
      float nh2 = max(dot(N, H2), 0.0), vh2 = max(dot(V, H2), 0.0);
      vec3 F2 = F_S(F0, vh2);
      vec3 spec2 = D_GGX(nh2, a2r) * G_S(nv, nl2, a2r) * F2 / (4.0 * nv * max(nl2, 1e-3) + 1e-4);
      col += ((1.0 - F2) * diffc + spec2) * uC2 * nl2 * 1.6;
      // ambient
      col += alb * (1.0 - met) * mix(vec3(0.012, 0.030, 0.028), vec3(0.060, 0.150, 0.150), N.y * 0.5 + 0.5) * ao * uAmb;
      // environment reflections
      vec3 R = reflect(rd, N);
      vec3 Fe = F_S(F0, nv) * (1.0 - 0.65 * rough);
      col += envMap(R, rough) * Fe * mix(0.35, 1.0, ao) * uEnv;

      // pulses
      if (inside) {
        ivec2 ti = ivec2(floor(uv * uTexSize));
        vec2 tr = texelFetch(uTr, ti, 0).rg;
        if (tr.g > 0.5) {
          float s = tr.r; float ph = tr.g - 1.0;
          float u = fract(s / uPulseSpacing - uPulseCycles * uPhase + ph);
          float head = pow(u, 5.0) * (1.0 - smoothstep(0.985, 1.0, u));
          float glow = 0.10 + head;
          vec3 ec = mix(vec3(1.0, 0.36, 0.04), vec3(1.0, 0.82, 0.45), clamp(head * head * 1.4, 0.0, 1.0));
          col += ec * glow * uPulseGain;
        }
      }
      // haze
      float fog = 1.0 - exp(-t * 0.0035);
      col = mix(col, vec3(0.012, 0.034, 0.034), fog * 0.6);
    }
  }
  oCol = vec4(col, tHit);
}`;

// ------------------------------------------------------------------ depth of field
const FS_DOF = `#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D uTex; uniform vec2 uRes; uniform float uFocus, uApert, uMaxCoC; uniform float uSeed;
out vec4 oCol;
float coc(float z){ return min(uApert * abs(z - uFocus) / max(z, 1.0), uMaxCoC); }
float ign(vec2 p){ return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec4 c0 = texture(uTex, uv);
  float r0 = coc(c0.a);
  vec3 acc = c0.rgb; float wsum = 1.0;
  float rot = ign(gl_FragCoord.xy + uSeed) * 6.2831853;
  const int N = 72;
  float R = max(r0, 2.0);
  // gather radius: full range so that blurred foreground can bleed over sharp pixels
  float Rg = uMaxCoC;
  for (int i = 0; i < N; i++){
    float a = float(i) * 2.39996323 + rot;
    float rr = sqrt((float(i) + 0.5) / float(N)) * Rg;
    vec2 off = vec2(cos(a), sin(a)) * rr;
    vec4 s = texture(uTex, uv + off / uRes);
    float rs = coc(s.a);
    float w = clamp(rs - rr + 1.0, 0.0, 1.0);
    // background samples must not bleed over nearer, sharper pixels
    float nearer = s.a < c0.a - 1.0 ? 1.0 : smoothstep(r0 * 0.5 - 0.5, r0 * 0.5 + 1.0, rr) ;
    w *= (s.a < c0.a - 1.0) ? 1.0 : clamp((r0 - rr + 1.0), 0.0, 1.0) ;
    w /= (rs * rs + 1.0) * 0.25 + 0.75;
    acc += s.rgb * w; wsum += w;
  }
  oCol = vec4(acc / wsum, c0.a);
}`;

// ------------------------------------------------------------------ bloom
const FS_BRIGHT = `#version 300 es
precision highp float; uniform sampler2D uTex; uniform vec2 uRes; uniform float uThr;
out vec4 oCol;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes; vec2 px = 1.0 / uRes;
  vec3 c = vec3(0.);
  c += texture(uTex, uv + px * vec2(-1.,-1.)).rgb; c += texture(uTex, uv + px * vec2(1.,-1.)).rgb;
  c += texture(uTex, uv + px * vec2(-1., 1.)).rgb; c += texture(uTex, uv + px * vec2(1., 1.)).rgb;
  c *= 0.25;
  float l = max(c.r, max(c.g, c.b));
  c *= max(l - uThr, 0.0) / max(l, 1e-4);
  oCol = vec4(c, 1.);
}`;
const FS_BLUR = `#version 300 es
precision highp float; uniform sampler2D uTex; uniform vec2 uRes; uniform vec2 uDir;
out vec4 oCol;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes; vec2 px = uDir / uRes;
  vec3 c = texture(uTex, uv).rgb * 0.2270270270;
  c += (texture(uTex, uv + px * 1.3846153846).rgb + texture(uTex, uv - px * 1.3846153846).rgb) * 0.3162162162;
  c += (texture(uTex, uv + px * 3.2307692308).rgb + texture(uTex, uv - px * 3.2307692308).rgb) * 0.0702702703;
  oCol = vec4(c, 1.);
}`;
const FS_DOWN = `#version 300 es
precision highp float; uniform sampler2D uTex; uniform vec2 uRes;
out vec4 oCol;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes; vec2 px = 0.5 / uRes;
  vec3 c = texture(uTex, uv + px * vec2(-1.,-1.)).rgb + texture(uTex, uv + px * vec2(1.,-1.)).rgb
         + texture(uTex, uv + px * vec2(-1., 1.)).rgb + texture(uTex, uv + px * vec2(1., 1.)).rgb;
  oCol = vec4(c * 0.25, 1.);
}`;

// ------------------------------------------------------------------ final grade
const FS_FINAL = `#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D uDof, uB0, uB1, uB2, uB3, uB4; uniform vec2 uRes; uniform float uExposure, uBloom, uSeed, uGrain;
out vec4 oCol;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
vec3 toSrgb(vec3 c){ return mix(c * 12.92, 1.055 * pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c)); }
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 q = uv - 0.5; q.x *= uRes.x / uRes.y;
  float rr = dot(q, q);
  vec2 ca = (uv - 0.5) * 0.0016 * (0.4 + rr * 2.5);
  vec3 col;
  col.r = texture(uDof, uv + ca).r; col.g = texture(uDof, uv).g; col.b = texture(uDof, uv - ca).b;
  vec3 bl = texture(uB0, uv).rgb * 0.34 + texture(uB1, uv).rgb * 0.30 + texture(uB2, uv).rgb * 0.26 + texture(uB3, uv).rgb * 0.22 + texture(uB4, uv).rgb * 0.18;
  col += bl * uBloom;
  col *= uExposure;
  col = aces(col);
  // grade: cool shadows, warm highlights
  float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(col * vec3(0.94, 1.02, 1.04), col * vec3(1.06, 1.0, 0.90), smoothstep(0.25, 0.85, l));
  col += vec3(0.002, 0.007, 0.007) * (1.0 - l);
  col = mix(vec3(l), col, 1.10);
  float vig = smoothstep(1.05, 0.28, sqrt(rr));
  col *= mix(0.42, 1.0, vig);
  col = toSrgb(col);
  float g = hash(gl_FragCoord.xy + uSeed * 17.0) + hash(gl_FragCoord.xy * 1.37 + uSeed * 31.0) - 1.0;
  col += g * uGrain;
  oCol = vec4(col, 1.0);
}`;

// ------------------------------------------------------------------ gl helpers
function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + '\n' + src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));
  return s;
}
function program(fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  p.loc = {}; return p;
}
function U(p, name){ if (!(name in p.loc)) p.loc[name] = gl.getUniformLocation(p, name); return p.loc[name]; }
function rtex(w, h){
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return {t, f, w, h};
}
function bindTex(unit, tex){ gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); }
function pass(p, target, setup){
  gl.useProgram(p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.f : null);
  const w = target ? target.w : canvas.width, h = target ? target.h : canvas.height;
  gl.viewport(0, 0, w, h);
  gl.uniform2f(U(p, 'uRes'), w, h);
  setup(p);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
async function fetchBin(url){ const r = await fetch(url); if (!r.ok) throw new Error(url); return new Uint8Array(await r.arrayBuffer()); }

let S = null;
async function init(){
  const meta = await (await fetch('data/meta.json')).json();
  const W = meta.w, H = meta.h;
  const mk = (internal, fmt, type, data, mips, nearest) => {
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, internal, W, H, 0, fmt, type, data);
    if (mips) gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, nearest ? gl.NEAREST : (mips ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, nearest ? gl.NEAREST : gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  };
  const alb = await fetchBin('data/alb.bin');
  const tAlb = mk(gl.SRGB8_ALPHA8, gl.RGBA, gl.UNSIGNED_BYTE, alb, true, false);
  const nrm = await fetchBin('data/nrm.bin');
  const tNrm = mk(gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, nrm, true, false);
  const hb = await fetchBin('data/height.bin');
  const tHgt = mk(gl.R16F, gl.RED, gl.HALF_FLOAT, new Uint16Array(hb.buffer, hb.byteOffset, hb.byteLength / 2), true, false);
  const tb = await fetchBin('data/trace.bin');
  const tTr = mk(gl.RG16F, gl.RG, gl.HALF_FLOAT, new Uint16Array(tb.buffer, tb.byteOffset, tb.byteLength / 2), false, true);
  S = {meta, tAlb, tNrm, tHgt, tTr,
       pScene: program(FS_SCENE), pDof: program(FS_DOF), pBright: program(FS_BRIGHT), pBlur: program(FS_BLUR), pDown: program(FS_DOWN), pFinal: program(FS_FINAL)};
  makeTargets(canvas.width, canvas.height);
  return true;
}
function makeTargets(w, h){
  S.rt = {scene: rtex(w, h), dof: rtex(w, h)};
  S.bl = [];
  let bw = w, bh = h;
  for (let i = 0; i < 5; i++){ bw = Math.max(bw >> 1, 2); bh = Math.max(bh >> 1, 2); S.bl.push({a: rtex(bw, bh), b: rtex(bw, bh)}); }
}
window.setSize = (w, h) => { canvas.width = w; canvas.height = h; makeTargets(w, h); };

// ------------------------------------------------------------------ camera + light rig (all periodic in u)
const D2R = Math.PI / 180;
const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0]/l, a[1]/l, a[2]/l]; };
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
function rig(u){
  const f = 2 * Math.PI * u;
  const target = [30.0 + 7.0 * Math.sin(f), 0.5, 17.2 + 1.6 * Math.cos(f)];
  const az = (-12 + 11 * Math.sin(f + 0.6)) * D2R;
  const el = (38 + 3.5 * Math.sin(f + 2.1)) * D2R;
  const dist = 31 + 2.0 * Math.sin(f + 1.0);
  const cam = [target[0] + Math.sin(az) * Math.cos(el) * dist, target[1] + Math.sin(el) * dist, target[2] + Math.cos(az) * Math.cos(el) * dist];
  const fwd = norm(sub(target, cam));
  const right = norm(cross(fwd, [0, 1, 0]));
  const up = cross(right, fwd);
  const azL = (104 + 34 * Math.sin(f + 1.2)) * D2R, elL = (25 + 5 * Math.sin(f)) * D2R;
  const L1 = [Math.cos(elL) * Math.sin(azL), Math.sin(elL), Math.cos(elL) * Math.cos(azL)];
  const azR = (-118 + 14 * Math.sin(f + 4.0)) * D2R, elR = 34 * D2R;
  const L2 = [Math.cos(elR) * Math.sin(azR), Math.sin(elR), Math.cos(elR) * Math.cos(azR)];
  const focus = dist + 1.6 * Math.sin(f + 2.3);
  return {cam, fwd, right, up, L1, L2, focus};
}

window.renderFrame = (u, opts) => {
  opts = opts || {};
  const r = rig(u);
  const W = canvas.width, Hh = canvas.height;
  const tanHalf = Math.tan(17 * D2R);
  pass(S.pScene, S.rt.scene, p => {
    gl.uniform3fv(U(p, 'uCam'), r.cam); gl.uniform3fv(U(p, 'uRight'), r.right); gl.uniform3fv(U(p, 'uUp'), r.up); gl.uniform3fv(U(p, 'uFwd'), r.fwd);
    gl.uniform1f(U(p, 'uTanHalf'), tanHalf); gl.uniform1f(U(p, 'uPhase'), u);
    gl.uniform3fv(U(p, 'uL1'), r.L1); gl.uniform3fv(U(p, 'uL2'), r.L2);
    gl.uniform3f(U(p, 'uC1'), 1.0, 0.60, 0.22); gl.uniform3f(U(p, 'uC2'), 0.22, 0.70, 0.78);
    gl.uniform1f(U(p, 'uAmb'), opts.amb ?? 1.0); gl.uniform1f(U(p, 'uEnv'), opts.env ?? 1.0);
    gl.uniform1f(U(p, 'uPulseGain'), opts.pulse ?? 6.0); gl.uniform1f(U(p, 'uPulseSpacing'), 9.0); gl.uniform1f(U(p, 'uPulseCycles'), 3.0);
    gl.uniform2f(U(p, 'uBoard'), S.meta.wmm, S.meta.hmm); gl.uniform2f(U(p, 'uTexSize'), S.meta.w, S.meta.h);
    gl.uniform1f(U(p, 'uPxmm'), S.meta.pxmm); gl.uniform1f(U(p, 'uHmax'), S.meta.hmax + 0.05);
    bindTex(0, S.tAlb); gl.uniform1i(U(p, 'uAlb'), 0);
    bindTex(1, S.tNrm); gl.uniform1i(U(p, 'uNrm'), 1);
    bindTex(2, S.tHgt); gl.uniform1i(U(p, 'uHgt'), 2);
    bindTex(3, S.tTr); gl.uniform1i(U(p, 'uTr'), 3);
  });
  const sc = W / 1920;
  pass(S.pDof, S.rt.dof, p => {
    bindTex(0, S.rt.scene.t); gl.uniform1i(U(p, 'uTex'), 0);
    gl.uniform1f(U(p, 'uFocus'), r.focus); gl.uniform1f(U(p, 'uApert'), (opts.apert ?? 95) * sc); gl.uniform1f(U(p, 'uMaxCoC'), (opts.maxcoc ?? 26) * sc);
    gl.uniform1f(U(p, 'uSeed'), opts.seed ?? (u * 977.0));
  });
  // bloom chain
  pass(S.pBright, S.bl[0].a, p => { bindTex(0, S.rt.dof.t); gl.uniform1i(U(p, 'uTex'), 0); gl.uniform1f(U(p, 'uThr'), opts.thr ?? 1.1); });
  for (let i = 0; i < 5; i++){
    const L = S.bl[i];
    pass(S.pBlur, L.b, p => { bindTex(0, L.a.t); gl.uniform1i(U(p, 'uTex'), 0); gl.uniform2f(U(p, 'uDir'), 1, 0); });
    pass(S.pBlur, L.a, p => { bindTex(0, L.b.t); gl.uniform1i(U(p, 'uTex'), 0); gl.uniform2f(U(p, 'uDir'), 0, 1); });
    if (i < 4) pass(S.pDown, S.bl[i + 1].a, p => { bindTex(0, L.a.t); gl.uniform1i(U(p, 'uTex'), 0); });
  }
  pass(S.pFinal, null, p => {
    bindTex(0, S.rt.dof.t); gl.uniform1i(U(p, 'uDof'), 0);
    for (let i = 0; i < 5; i++){ bindTex(1 + i, S.bl[i].a.t); gl.uniform1i(U(p, 'uB' + i), 1 + i); }
    gl.uniform1f(U(p, 'uExposure'), opts.exposure ?? 1.0); gl.uniform1f(U(p, 'uBloom'), opts.bloom ?? 0.55);
    gl.uniform1f(U(p, 'uSeed'), opts.seed ?? (u * 977.0)); gl.uniform1f(U(p, 'uGrain'), opts.grain ?? 0.016);
  });
  gl.finish();
  const fmt = opts.fmt || 'jpeg';
  return canvas.toDataURL(fmt === 'png' ? 'image/png' : 'image/jpeg', 0.95);
};

window.initReady = init().then(() => 'ok').catch(e => 'ERR ' + e.message);
</script>
